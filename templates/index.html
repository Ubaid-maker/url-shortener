<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 1.5rem;
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #22c55e;
        }

        .result p {
            color: #22c55e;
            margin-bottom: 0.5rem;
        }

        .result a {
            color: #60a5fa;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔗 URL Shortener</h1>
        <p>Paste your long URL and get a short one instantly</p>
        <form method="POST">
            <input type="url" name="long_url" placeholder="https://example.com/very-long-url" required>
            <button type="submit">Shorten URL</button>
        </form>
        {% if short_url %}
        <div class="result">
            <p>✅ Your short URL is ready!</p>
            <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
        </div>
        {% endif %}
    </div>
</body>

</html>
